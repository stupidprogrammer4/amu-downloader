[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amu-downloader-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "amu-downloader-contracts==0.1.0", "aiogram==3.31.0", "aiohttp==3.14.3",
  "httpx==0.28.1", "python-dotenv==1.2.4", "redis==8.1.0",
]

[tool.setuptools.packages.find]
include = ["downloader_bot*"]

[tool.setuptools.package-data]
"downloader_bot.media" = ["assets/*.png"]
