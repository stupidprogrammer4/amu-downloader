name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -ptest-only-password"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:8.2.1-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      DOWNLOADER_TEST_DATABASE_URL: mysql+aiomysql://root:test-only-password@127.0.0.1:3306/mysql
      DOWNLOADER_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: api:bots:packages/contracts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned dependencies and local packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r api/requirements-dev.lock -r bots/requirements.lock
          .venv/bin/python -m pip install --no-deps -e packages/contracts -e api -e bots
          .venv/bin/python -m pip check
      - name: Install media codecs and headless browser for native workflows
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          .venv/bin/python -m playwright install --with-deps --only-shell chromium
      - name: Check formatting, types and publication contents
        run: |
          .venv/bin/ruff check api bots packages tests
          .venv/bin/ruff format --check api bots packages tests
          .venv/bin/pyright
          test -z "$(git ls-files tools AGENTS.md WORK.md)"
          if git grep -n -P '[\x{0600}-\x{06ff}]' -- '*.md'; then
            echo 'Documentation must be English'; exit 1
          fi
          if git log --format=%B | grep -P '[\x{0600}-\x{06ff}]'; then
            echo 'Commit messages must be English'; exit 1
          fi
      - name: Execute native MySQL, scheduler, Redis and worker workflows
        run: .venv/bin/python -m pytest tests -q
      - name: Scan committed history for secrets
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner \
            --config /repo/.gitleaks.toml
      - name: Audit runtime Python dependencies
        run: |
          python -m venv /tmp/downloader-audit
          /tmp/downloader-audit/bin/pip install pip-audit==2.10.1
          .venv/bin/python -m pip freeze --all | \
            grep '==' | grep -viE '^(amu-downloader-(api|bot|contracts)|papilio(-tasks)?)==' > /tmp/downloader-audit.txt
          /tmp/downloader-audit/bin/pip-audit --no-deps --disable-pip -r /tmp/downloader-audit.txt
      - name: Validate container topology with synthetic credentials
        env:
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
          DOWNLOADER_DATABASE_URL: mysql+aiomysql://downloader:test@mysql:3306/downloader
          DOWNLOADER_SERVICE_KEY: test-service-key-test-service-key-test-service-key
          DOWNLOADER_ADMIN_USER_IDS: '140001'
          DOWNLOADER_BOT_TOKEN: '140003:TEST_ONLY_NOT_REAL'
          DOWNLOADER_WEBHOOK_SECRET: media-test-key-media-test-key-media-test-key
        run: docker compose --env-file /dev/null config --quiet
      - name: Build both production images
        run: |
          docker build -f api/Dockerfile -t downloader-api:test .
          docker build -f bots/Dockerfile -t downloader-bots:test .
      - name: Verify bot sessions through native Redis and container networks
        env:
          DOWNLOADER_BOT_TEST_IMAGE: downloader-bots:test
        run: .venv/bin/python -m pytest tests/integration/test_bot_network.py -q
      - name: Scan image dependencies and operating system packages
        run: |
          for image in downloader-api:test downloader-bots:test; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v downloader-trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image"
          done
