[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["src", "downloader_bot", "downloader_contracts"]

[tool.pyright]
include = ["api/src", "bots/downloader_bot", "packages/contracts/downloader_contracts"]
extraPaths = ["api", "bots", "packages/contracts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api", "bots", "packages/contracts"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["integration: requires isolated MySQL and Redis", "unit: isolated policies and contracts", "api: native API workflows"]
